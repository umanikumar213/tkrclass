<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3fa">
  <title data-sp-text="admin_page_title">TKR Spotlight · Admin</title>
  <link rel="stylesheet" href="/spotlight.css?v=20261119c">
  <script defer src="/spotlight-editor.js?v=20261119c"></script>
  <script defer src="/spotlight-ui.js?v=20261119c"></script>
  <script defer src="/spotlight.js?v=20261119c"></script>
</head>
<body data-spotlight-page="admin">
  <main class="sp-shell sp-narrow" id="app">
    <section id="spotlightTextsError" class="sp-state" hidden><strong data-sp-text="texts_load_error">Spotlight content could not load. Check your connection and retry.</strong><button id="spotlightTextsRetry" type="button" class="sp-btn sp-btn-secondary" data-sp-text="texts_retry">Retry loading Spotlight</button></section>
    <header class="sp-topbar">
      <a class="sp-brand" href="/spotlight" aria-label="TKR Spotlight" data-sp-aria="brand_name">
        <span class="sp-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.2 14.3 9l6.2.5-4.7 4 1.5 6-5.3-3.3-5.3 3.3 1.5-6-4.7-4L9.7 9 12 3.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12.1" r="2.2" fill="currentColor"/></svg></span>
        <span><span class="sp-brand-name" data-sp-text="brand_name">TKR Spotlight</span><span class="sp-brand-sub" data-sp-text="admin_review_brand_sub">Review desk</span></span>
      </a>
       <div class="sp-header-actions"><span class="sp-admin-avatar" aria-hidden="true" data-sp-text="admin_avatar">TKR</span><a class="sp-back" href="/spotlight" data-sp-text="admin_public_page">Public page</a></div>
    </header>
    <section id="adminLoginView" class="sp-login-card">
      <div class="sp-kicker" data-sp-text="login_staff_kicker">Staff only</div>
      <h1 data-sp-text="login_title">Review desk</h1>
      <p class="sp-intro" data-sp-text="login_description">Sign in with the existing admin password to review notes and manage student profiles.</p>
      <form id="adminLoginForm">
        <label for="adminPassword" data-sp-text="login_password_label">Admin password</label>
        <input class="sp-login-input" id="adminPassword" type="password" autocomplete="current-password" required>
        <button class="sp-btn" id="adminLoginButton" type="submit" data-sp-text="login_button">Open review desk</button>
        <div id="adminLoginError" class="sp-message" role="alert"></div>
      </form>
    </section>
    <section id="adminView" hidden>
      <div class="sp-section-head" style="margin:14px 0">
        <div><div class="sp-kicker" data-sp-text="admin_header">TKR Spotlight</div><h1 class="sp-title" style="font-size:34px" data-sp-text="admin_review_title">Review desk</h1></div>
        <button type="button" id="adminLogout" class="sp-btn sp-btn-secondary" data-sp-text="admin_logout">Sign out</button>
      </div>
     <div class="sp-admin-layout">
       <nav id="adminTabs" class="sp-admin-tabs" aria-label="Moderation views" data-sp-aria="admin_tabs_aria">
         <button type="button" class="sp-admin-tab" data-admin-tab="pending" aria-selected="true"><span data-sp-text="admin_pending_tab">Pending</span> <span id="pendingBadge" class="sp-badge">0</span></button>
         <button type="button" class="sp-admin-tab" data-admin-tab="reported" aria-selected="false" data-sp-text="admin_reported_tab">Reported</button>
         <button type="button" class="sp-admin-tab" data-admin-tab="students" aria-selected="false" data-sp-text="admin_students_tab">Hidden students</button>
         <button type="button" class="sp-admin-tab" data-admin-tab="settings" aria-selected="false" data-sp-text="content_settings_tab">Content &amp; Settings</button>
       </nav>
       <div class="sp-admin-main"><div id="adminContent" aria-live="polite"></div><div id="adminError" class="sp-message" role="alert"></div></div>
     </div>
    </section>
    <div id="toast" class="sp-toast" role="status" aria-live="polite"></div>
     <dialog id="spotlightConfirmDialog" class="sp-confirm-dialog" aria-labelledby="confirmDialogTitle">
       <div class="sp-confirm-content"><h2 id="confirmDialogTitle" data-sp-text="confirm_title">One quick check</h2><p id="confirmDialogMessage"></p><div class="sp-confirm-actions"><button type="button" class="sp-btn sp-btn-secondary" data-confirm-cancel data-sp-text="confirm_cancel">Keep editing</button><button type="button" class="sp-btn sp-btn-danger" data-confirm-accept data-sp-text="confirm_accept">Continue</button></div></div>
     </dialog>
  </main>
</body>
</html>
