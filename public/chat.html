<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confession Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7B1800; --maroon-dark:#5e1200; --gold:#E8A000; --gold-soft:#fdf3df;
    --bg:#faf7f4; --card:#fff; --line:#eee2da; --ink:#241a16; --sub:#7a6a62; --faint:#a89a92;
    --red:#dc2626; --red-soft:#fdecec; --green:#0f9d58;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 80px}

  /* --- header --- */
  header{margin-bottom:14px}
  header .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
  header h1{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--maroon);margin-top:2px}
  header p{color:var(--sub);font-size:12px;margin-top:2px}

  /* --- compose box --- */
  .compose{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  textarea{width:100%;min-height:64px;max-height:160px;padding:9px 10px;font-family:inherit;font-size:14px;
    color:var(--ink);border:1px solid var(--line);border-radius:8px;outline:none;resize:vertical}
  textarea:focus{border-color:var(--maroon);box-shadow:0 0 0 3px #7b180014}
  .compose-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .cnt{font-size:11px;color:var(--faint);white-space:nowrap;margin-left:auto}
  .filebtn{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border:1px dashed var(--line);
    border-radius:8px;font-size:12px;color:var(--sub);cursor:pointer;background:#fffdf8;white-space:nowrap}
  .filebtn:hover{border-color:var(--gold);color:var(--maroon)}
  #fileName{font-size:12px;color:var(--sub);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #clearMedia{display:none;font-size:12px;color:var(--red);background:none;border:none;cursor:pointer;font-family:inherit;padding:0}
  .btn{flex:1;min-width:120px;padding:10px 14px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;
    font-weight:600;font-size:13px;color:#fff;background:var(--maroon);transition:.15s;white-space:nowrap}
  .btn:hover{background:var(--maroon-dark)} .btn:disabled{opacity:.55;cursor:not-allowed}
  .msg{margin-top:8px;padding:9px 12px;border-radius:8px;font-size:12px;display:none}
  .msg.ok{background:var(--gold-soft);color:#8a6100;display:block}
  .msg.bad{background:var(--red-soft);color:var(--red);display:block}

  .mood-select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:13px;outline:none}
  .mood-select:focus{border-color:var(--maroon);box-shadow:0 0 0 3px #7b180014}
  /* --- mood filter --- */
  .moods{display:flex;gap:6px;overflow-x:auto;padding:2px;margin-bottom:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .moods::-webkit-scrollbar{display:none}
  .mood{flex-shrink:0;padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;
    font-family:inherit;font-size:11px;font-weight:500;color:var(--sub);text-align:center;line-height:1.3;transition:.15s}
  .mood.active{background:var(--maroon);border-color:var(--maroon);color:#fff}

  /* --- posts --- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .post-inner{padding:14px 16px}
  .post-inner .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .pnum{font-weight:700;font-size:15px;color:var(--maroon)}
  .pdate{font-size:11px;color:var(--faint)}
  .ptext{font-size:14px;white-space:pre-wrap;word-break:break-word}
  .pimg{margin-top:10px;border-radius:10px;max-width:100%;display:block;border:1px solid var(--line);opacity:0;transition:opacity .35s ease}
  .pimg.loaded{opacity:1}
  .pvideo{width:100%;max-height:420px;margin-top:10px;display:block;border:1px solid var(--line);border-radius:10px;background:#111}
  .mood-tag{display:inline-flex;align-items:center;margin-left:7px;padding:3px 7px;border-radius:999px;background:var(--gold-soft);color:#8a6100;font-size:10px;font-weight:600}
  .pfoot{margin-top:10px;display:flex;justify-content:space-between;align-items:center}
  .report{background:none;border:none;font-family:inherit;font-size:11px;color:var(--faint);cursor:pointer}
  .report:hover{color:var(--red)}
  .empty{text-align:center;color:var(--faint);font-size:14px;padding:36px 0}

  /* --- reactions --- */
  .reactions{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .rbtn{display:inline-flex;align-items:center;gap:3px;padding:5px 9px;border:1px solid var(--line);
    border-radius:20px;background:#fff;font-family:inherit;font-size:14px;cursor:pointer;
    color:var(--sub);transition:.12s;white-space:nowrap;line-height:1}
  .rbtn:hover{border-color:var(--gold);background:var(--gold-soft)}
  .rbtn.sel{background:var(--gold-soft);border-color:var(--gold);color:var(--maroon)}
  .rbtn span{font-size:12px;font-weight:500}

  /* --- comments toggle button --- */
  .ccount{background:none;border:none;font-family:inherit;font-size:14px;font-weight:500;
    color:var(--sub);cursor:pointer;padding:0;display:flex;align-items:center;gap:5px}
  .ccount:hover{color:var(--maroon)}

  /* --- comments section (inside card, below post-inner) --- */
  .comments-section{border-top:1px solid var(--line);background:#fdf9f6;padding:12px 16px 14px}
  .c-list{margin-bottom:10px}
  .c-item{padding:8px 0;border-bottom:1px solid var(--line)}
  .c-item:last-child{border-bottom:none}
  .c-text{font-size:13px;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .c-date{font-size:11px;color:var(--faint);margin-top:2px}
  .c-empty{font-size:13px;color:var(--faint);padding:4px 0 8px}
  .c-form{display:flex;gap:6px;margin-top:6px}
  .c-form textarea{flex:1;min-height:44px;max-height:96px;padding:7px 9px;font-family:inherit;font-size:13px;
    color:var(--ink);border:1px solid var(--line);border-radius:8px;outline:none;resize:vertical;background:#fff}
  .c-form textarea:focus{border-color:var(--maroon);box-shadow:0 0 0 3px #7b180014}
  .c-send{align-self:flex-end;padding:8px 13px;border:none;border-radius:8px;cursor:pointer;
    font-family:inherit;font-weight:600;font-size:12px;color:#fff;background:var(--maroon);white-space:nowrap;transition:.15s}
  .c-send:hover{background:var(--maroon-dark)} .c-send:disabled{opacity:.55;cursor:not-allowed}
  .c-msg{font-size:12px;margin-top:6px;padding:6px 9px;border-radius:6px;display:none}
  .c-msg.ok{background:var(--gold-soft);color:#8a6100;display:block}
  .c-msg.bad{background:var(--red-soft);color:var(--red);display:block}

  /* --- load more --- */
  #loadMoreBtn{display:none;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;
    background:#fff;font-family:inherit;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;margin-top:4px;transition:.15s}
  #loadMoreBtn:hover{border-color:var(--maroon);color:var(--maroon)}
  #loadMoreBtn:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Anonymous · No names · No logins</div>
    <h1>Confession Board</h1>
    <p>Posts stay here permanently.</p>
  </header>

  <div class="compose">
    <textarea id="text" maxlength="500" placeholder="Your confession or opinion… (max 500 characters)"></textarea>
    <div class="compose-row">
      <select class="mood-select" id="mood" aria-label="Mood">
        <option value="Heartache">💔 Heartache</option>
        <option value="Nostalgia">🌧️ Nostalgia</option>
        <option value="Goosebumps">⚡ Goosebumps</option>
        <option value="Midnight Thoughts">🌙 Midnight Thoughts</option>
        <option value="Alone">🌌 Alone</option>
        <option value="Other / Casual" selected>✨ Other / Casual</option>
      </select>
    </div>
    <div class="compose-row">
      <label class="filebtn">📷 Image<input type="file" id="img" accept=".jpg,.jpeg,.png,.webp" hidden></label>
      <label class="filebtn">🎬 Video<input type="file" id="video" accept=".mp4,video/mp4" hidden></label>
      <span id="fileName"></span>
      <button id="clearMedia" onclick="clearMedia()">✕</button>
      <span class="cnt"><span id="cnt">0</span>/500</span>
      <button class="btn" id="submitBtn" onclick="submitPost()">Submit anonymously</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="moods" id="moods" aria-label="Filter by mood"></div>
  <div id="feed"></div>
  <button id="loadMoreBtn" onclick="loadMore()">Load more posts</button>
</div>

<script>
const txt=document.getElementById('text'),cnt=document.getElementById('cnt'),imgIn=document.getElementById('img'),videoIn=document.getElementById('video');
const MOODS=[['Heartache','💔 Heartache'],['Nostalgia','🌧️ Nostalgia'],['Goosebumps','⚡ Goosebumps'],['Midnight Thoughts','🌙 Midnight Thoughts'],['Alone','🌌 Alone'],['Other / Casual','✨ Other / Casual']];
let selectedMood='', currentPage=1, hasMore=false, loading=false;

txt.addEventListener('input',()=>cnt.textContent=txt.value.length);
imgIn.addEventListener('change',()=>{
  const f=imgIn.files[0];
  document.getElementById('fileName').textContent=f?f.name:'';
  if(f)videoIn.value='';
  document.getElementById('clearMedia').style.display=f?'inline':'none';
});
videoIn.addEventListener('change',()=>{
  const f=videoIn.files[0];
  document.getElementById('fileName').textContent=f?f.name:'';
  if(f)imgIn.value='';
  document.getElementById('clearMedia').style.display=f?'inline':'none';
});
function clearMedia(){imgIn.value='';videoIn.value='';document.getElementById('fileName').textContent='';document.getElementById('clearMedia').style.display='none';}
function showMsg(t,ok){const m=document.getElementById('msg');m.className='msg '+(ok?'ok':'bad');m.textContent=t;}

async function submitPost(){
  const btn=document.getElementById('submitBtn');
  const text=txt.value.trim();
  if(!text){showMsg('Please write something first.',false);return;}
  const image=imgIn.files[0],video=videoIn.files[0];
  if(image&&image.size>5*1024*1024){showMsg('Image must be under 5MB.',false);return;}
  if(video&&(video.type!=='video/mp4'||video.size>20*1024*1024)){showMsg('Video must be an MP4 under 20MB.',false);return;}
  btn.disabled=true;btn.textContent='Submitting…';
  try{
    const fd=new FormData();fd.append('text',text);fd.append('mood',document.getElementById('mood').value);
    if(image)fd.append('image',image);if(video)fd.append('video',video);
    const r=await fetch('/api/chat/posts',{method:'POST',body:fd});
    const d=await r.json();
    showMsg(d.message||(d.success?'Submitted!':'Something went wrong.'),d.success);
    if(d.success){txt.value='';cnt.textContent='0';clearMedia();}
  }catch(e){showMsg('Cannot reach server. Try again.',false);}
  btn.disabled=false;btn.textContent='Submit anonymously';
}

function buildMoods(){
  const el=document.getElementById('moods');
  el.innerHTML=[['','All'],...MOODS].map(([value,label])=>
    `<button class="mood ${selectedMood===value?'active':''}" data-mood="${esc(value)}" onclick="pickMood(this.dataset.mood)">${label}</button>`
  ).join('');
}
function pickMood(value){selectedMood=value;buildMoods();resetFeed();loadFeed();}

function resetFeed(){currentPage=1;hasMore=false;document.getElementById('feed').innerHTML='';document.getElementById('loadMoreBtn').style.display='none';}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function fmtDate(s){const d=new Date(s);return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});}

// --- reactions ---
const EMOJIS=[['heart','❤️'],['laugh','😂'],['wow','😮'],['sad','😢'],['fire','🔥'],['up','👍']];
function getReaction(id){return localStorage.getItem('react_'+id)||null;}
function setReaction(id,emoji){if(emoji)localStorage.setItem('react_'+id,emoji);else localStorage.removeItem('react_'+id);}

function reactRow(p){
  const cur=getReaction(p.id);
  return '<div class="reactions">'+EMOJIS.map(([k,e])=>
    `<button class="rbtn${cur===k?' sel':''}" onclick="react(${p.id},'${k}',this.closest('.reactions'))">${e} <span>${p['react_'+k]||0}</span></button>`
  ).join('')+'</div>';
}

async function react(id,tapped,container){
  const prev=getReaction(id);
  const emoji=tapped===prev?null:tapped;
  const btns=container.querySelectorAll('.rbtn');
  EMOJIS.forEach(([k],i)=>{
    const span=btns[i].querySelector('span');
    let c=parseInt(span.textContent,10)||0;
    if(k===prev&&prev!==emoji)c=Math.max(0,c-1);
    if(k===emoji)c++;
    span.textContent=c;
    btns[i].classList.toggle('sel',k===emoji);
  });
  setReaction(id,emoji);
  try{
    await fetch('/api/chat/posts/'+id+'/react',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({emoji,prev})
    });
  }catch(e){}
}

// --- comments ---
async function toggleComments(id, btn){
  const section=document.getElementById('cs-'+id);
  if(section.style.display!=='none'){section.style.display='none';btn.textContent=btn.dataset.label;return;}
  section.style.display='block';
  if(section.dataset.loaded){return;} // already fetched, just show
  section.innerHTML='<div class="c-empty">Loading…</div>';
  try{
    const r=await fetch('/api/chat/posts/'+id+'/comments');
    const d=await r.json();
    if(!d.success)throw new Error();
    renderComments(id, d.comments, section);
    section.dataset.loaded='1';
  }catch(e){section.innerHTML='<div class="c-empty">Could not load comments.</div>';}
}

function renderComments(id, comments, section){
  let html='<div class="c-list">';
  if(comments.length){
    html+=comments.map(c=>`<div class="c-item"><div class="c-text">${esc(c.text)}</div><div class="c-date">${fmtDate(c.created_at)}</div></div>`).join('');
  }else{
    html+='<div class="c-empty">No replies yet. Be the first!</div>';
  }
  html+='</div>';
  html+=`<div class="c-form">
    <textarea id="ct-${id}" maxlength="280" placeholder="Reply anonymously… (max 280 chars)"></textarea>
    <button class="c-send" onclick="submitComment(${id})">Reply</button>
  </div>
  <div class="c-msg" id="cm-${id}"></div>`;
  section.innerHTML=html;
}

async function submitComment(id){
  const ta=document.getElementById('ct-'+id);
  const msgEl=document.getElementById('cm-'+id);
  const btn=ta.closest('.c-form').querySelector('.c-send');
  const text=ta.value.trim();
  if(!text){showCMsg(msgEl,'Write something first.',false);return;}
  btn.disabled=true;btn.textContent='Sending…';
  try{
    const r=await fetch('/api/chat/posts/'+id+'/comments',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})
    });
    const d=await r.json();
    showCMsg(msgEl,d.message||(d.success?'Submitted!':'Something went wrong.'),d.success);
    if(d.success)ta.value='';
  }catch(e){showCMsg(msgEl,'Cannot reach server.',false);}
  btn.disabled=false;btn.textContent='Reply';
}

function showCMsg(el,t,ok){el.className='c-msg '+(ok?'ok':'bad');el.textContent=t;}

async function loadFeed(){
  if(loading)return;
  loading=true;
  const feed=document.getElementById('feed');
  const loadMoreBtn=document.getElementById('loadMoreBtn');
  if(currentPage===1)feed.innerHTML='<div class="empty">Loading…</div>';
  else{loadMoreBtn.disabled=true;loadMoreBtn.textContent='Loading…';}
  try{
    let url='/api/chat/posts?page='+currentPage;
    if(selectedMood)url+='&mood='+encodeURIComponent(selectedMood);
    const r=await fetch(url);
    const d=await r.json();
    if(!d.success){
      if(currentPage===1)feed.innerHTML='<div class="empty">Could not load posts.</div>';
      loading=false;return;
    }
    if(currentPage===1&&!d.posts.length){
      feed.innerHTML='<div class="empty">No confessions '+(selectedMood?'with this mood':'yet')+'. Be the first 👀</div>';
      loadMoreBtn.style.display='none';loading=false;return;
    }
    if(currentPage===1)feed.innerHTML='';
    const n=d.posts.length;
    for(let i=0;i<n;i++){
      const p=d.posts[i];
      const cc=parseInt(p.comment_count)||0;
      const label=`💬 ${cc} ${cc===1?'reply':'replies'}`;
      const html=`<div class="card" id="pc-${p.id}">
        <div class="post-inner">
          <div class="top"><span><span class="pnum">#${p.post_number}</span><span class="mood-tag">${esc(p.mood||'Other / Casual')}</span></span><span class="pdate">${fmtDate(p.created_at)}</span></div>
          <div class="ptext">${esc(p.text)}</div>
          ${p.has_image?`<img class="pimg" src="/api/chat/image/${p.id}" loading="lazy" alt="" onload="this.classList.add('loaded')">`:''}
          ${p.has_video?`<video class="pvideo" controls playsinline preload="metadata" src="/api/chat/stream/${encodeURIComponent(p.video_file_id)}"></video>`:''}
          ${reactRow(p)}
          <div class="pfoot">
            <button class="ccount" data-label="${label}" onclick="toggleComments(${p.id},this)">${label}</button>
            <button class="report" onclick="report(${p.id},this)">⚑ Report</button>
          </div>
        </div>
        <div class="comments-section" id="cs-${p.id}" style="display:none"></div>
      </div>`;
      feed.insertAdjacentHTML('beforeend',html);
    }
    hasMore=d.hasMore;
    loadMoreBtn.style.display=hasMore?'block':'none';
    loadMoreBtn.disabled=false;
    loadMoreBtn.textContent='Load more posts';
  }catch(e){
    if(currentPage===1)feed.innerHTML='<div class="empty">Cannot reach server.</div>';
  }
  loading=false;
}

async function loadMore(){
  if(!hasMore||loading)return;
  currentPage++;
  await loadFeed();
}

async function report(id,btn){
  if(!confirm('Report this post to the admin?'))return;
  try{
    const r=await fetch('/api/chat/posts/'+id+'/report',{method:'POST'});
    const d=await r.json();
    btn.textContent=d.success?'Reported ✓':'⚑ Report';btn.disabled=d.success;
  }catch(e){}
}
buildMoods();loadFeed();
</script>
</body>
</html>
